# Copy this file to config.toml (which is git-ignored) and set your real library path.
# The app only ever READS from this path — it never writes book content back or commits it.

[library]
# Absolute path to your book library. Example only — set your own in config.toml.
path = "/absolute/path/to/your/books"
# File types to treat as books.
extensions = ["pdf", "epub", "mobi", "djvu"]

[tts]
# "system" uses an offline OS voice; no cloud. (Engine wired up later.)
engine = "system"

[summary]
# "ollama" = local, book text stays on this machine (default, and the private option).
# "gemini" = Google's API — BOOK TEXT LEAVES THIS MACHINE. Opt in knowingly.
provider = "ollama"

# Model for whichever provider is selected above.
#   ollama: run `ollama list` to see what you have pulled
#   gemini: gemini-2.5-flash, gemini-2.5-pro, ...
model = "qwen2.5:1.5b"

# The Gemini API key is NEVER stored here — this file is committed. It is read from the
# GEMINI_API_KEY (or GOOGLE_API_KEY) environment variable, or from .env, which is git-ignored.
