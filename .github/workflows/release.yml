# Builds downloadable apps on every tag and attaches them to a GitHub Release,
# so anyone can install without a store.
#
# Linux gets three artefacts, because "install it" means different things to
# different people:
#   - AppImage  — one file, chmod +x, run. No root, no package manager.
#   - .tar.gz   — the raw bundle for anyone who prefers to unpack it themselves.
#   - .deb      — for Debian/Ubuntu users who want it in their menu properly.
# macOS gets a .dmg, Windows a .zip.
#
# Each platform builds and uploads an artefact; a single `publish` job collects
# them and creates the release. That split is not cosmetic — three jobs each
# calling action-gh-release on the same tag race each other, and the loser's
# assets go missing from a release that still looks successful.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

# Resolved once and shared, so the three builds cannot disagree about what
# version they are producing.
jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not floating. `channel: stable` silently moved CI from
          # Flutter 3.41 to 3.47 with no commit of ours, and 3.47's Dart refuses
          # to compile pdfrx_engine 0.4.5 (a transitive pin of pdfrx 2.4.7):
          #   pdf_file_cache.dart:380 — 'blockSize' on a potentially null
          #   'PdfFileCache?'.
          # The fix in pdfrx_engine 0.4.6 needs meta ^1.18.0, which this
          # Flutter's flutter_test does not allow, so the toolchain and the
          # dependency can only be moved together. Pin until pdfrx releases a
          # version that resolves to 0.4.6.
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # Everything the desktop embedder and our helper libraries need.
      # lld is the one that bites: /usr/lib/llvm-*/bin ships clang without a
      # linker on some images, and the native build fails looking for it.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            lld file desktop-file-utils

      - name: Build
        working-directory: app
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Test
        working-directory: app
        run: flutter test --concurrency=1

      # ── tarball ──
      - name: Package tarball
        working-directory: app/build/linux/x64/release
        run: |
          mv bundle audiobook-reader
          tar czf "$GITHUB_WORKSPACE/audiobook-reader-${{ needs.version.outputs.version }}-linux-x64.tar.gz" audiobook-reader

      # ── AppImage ──
      #
      # The point of this build: a single file that runs on any reasonably
      # recent distribution with no install step and no root.
      - name: Build AppImage
        run: |
          set -eu
          APP=AppDir
          mkdir -p $APP/usr/bin $APP/usr/share/applications $APP/usr/share/icons/hicolor/256x256/apps
          cp -r app/build/linux/x64/release/audiobook-reader/* $APP/usr/bin/

          cp app/packaging/linux/*.desktop \
            $APP/usr/share/applications/io.github.developer1010x.AudiobookReader.desktop
          cp app/packaging/linux/*.desktop $APP/io.github.developer1010x.AudiobookReader.desktop

          # An AppImage needs an icon at the root; generate a placeholder if the
          # repo has none yet so the build never fails on a missing asset.
          if [ -f app/packaging/linux/icon-256.png ]; then
            cp app/packaging/linux/icon-256.png $APP/io.github.developer1010x.AudiobookReader.png
          else
            sudo apt-get install -y imagemagick
            convert -size 256x256 xc:'#5B6ABF' \
              -gravity center -pointsize 120 -fill white -annotate 0 'A' \
              $APP/io.github.developer1010x.AudiobookReader.png
          fi
          cp $APP/io.github.developer1010x.AudiobookReader.png \
            $APP/usr/share/icons/hicolor/256x256/apps/

          cat > $APP/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/audiobook_reader" "$@"
          EOF
          chmod +x $APP/AppRun

          # Fetch the build tool into its own directory. It is itself an
          # .AppImage, so leaving it in the workspace root makes the release
          # step's *.AppImage glob match it and publish appimagetool alongside
          # the app — which is what happened in v1.0.0.
          mkdir -p .appimagetool
          wget -q -O .appimagetool/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x .appimagetool/appimagetool
          ./.appimagetool/appimagetool --appimage-extract-and-run $APP \
            "audiobook-reader-${{ needs.version.outputs.version }}-x86_64.AppImage"

      # ── deb ──
      - name: Build .deb
        run: |
          set -eu
          PKG=debpkg
          mkdir -p $PKG/DEBIAN $PKG/opt/audiobook-reader \
                   $PKG/usr/share/applications $PKG/usr/bin \
                   $PKG/usr/share/metainfo
          cp -r app/build/linux/x64/release/audiobook-reader/* $PKG/opt/audiobook-reader/
          cp app/packaging/linux/*.desktop $PKG/usr/share/applications/
          cp app/packaging/linux/*.metainfo.xml $PKG/usr/share/metainfo/
          ln -s /opt/audiobook-reader/audiobook_reader $PKG/usr/bin/audiobook-reader

          cat > $PKG/DEBIAN/control <<EOF
          Package: audiobook-reader
          Version: ${{ needs.version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: S Prajwall Narayana <sprajwalln@gmail.com>
          Depends: libgtk-3-0, libsecret-1-0, libjsoncpp25 | libjsoncpp-dev
          Recommends: tesseract-ocr, speech-dispatcher, speech-dispatcher-espeak-ng
          Description: Private reader and audiobook player for your own library
           Read, listen to and study your own books. PDF, EPUB, Markdown and text,
           with neural text-to-speech, follow-along highlighting, text recognition
           for scans, and optional AI study aids that run locally by default.
          EOF

          dpkg-deb --build $PKG \
            "audiobook-reader_${{ needs.version.outputs.version }}_amd64.deb"

      - name: Validate packaging metadata
        working-directory: app/packaging/linux
        run: desktop-file-validate *.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            audiobook-reader-*.AppImage
            audiobook-reader-*.tar.gz
            audiobook-reader_*.deb
          if-no-files-found: error

  macos:
    needs: version
    # A specific runner image, not `macos-latest`: that label moves between
    # macOS and Xcode major versions without a commit of ours, which is the
    # same class of silent drift the Flutter pin above exists to prevent.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Kept in lockstep with the linux job — see the note there.
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release

      - name: Test
        working-directory: app
        run: flutter test --concurrency=1

      # hdiutil ships with macOS, so this needs no extra tooling. The .app name
      # is globbed rather than hardcoded: it follows the Xcode product name,
      # which is not the same string as the pubspec package name.
      - name: Package .dmg
        run: |
          set -eu
          APP=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "No .app produced"; exit 1; }
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          # A symlink to /Applications makes the DMG a drag-to-install window
          # rather than a folder the user has to work out what to do with.
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "Audier" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "audiobook-reader-${{ needs.version.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: audiobook-reader-*.dmg
          if-no-files-found: error

  windows:
    needs: version
    # Pinned for the same reason as macos above.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Kept in lockstep with the linux job — see the note there.
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Test
        working-directory: app
        run: flutter test --concurrency=1

      # A plain zip rather than an installer: an .msi or .msix has to be signed
      # to install without a scary prompt, and no signing certificate exists for
      # this project yet. An unsigned zip is honest about what it is.
      - name: Package .zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'app/build/windows/x64/runner/Release'
          if (-not (Test-Path $bundle)) { throw "No Windows bundle at $bundle" }
          Compress-Archive -Path "$bundle/*" `
            -DestinationPath "audiobook-reader-${{ needs.version.outputs.version }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: audiobook-reader-*.zip
          if-no-files-found: error

  publish:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Audiobook Reader ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            **Linux — anything (no root, no package manager)**
            ```bash
            chmod +x audiobook-reader-*.AppImage
            ./audiobook-reader-*.AppImage
            ```

            **Debian / Ubuntu**
            ```bash
            sudo dpkg -i audiobook-reader_*_amd64.deb
            sudo apt -f install    # if dependencies are missing
            ```

            **Linux tarball**
            ```bash
            tar xzf audiobook-reader-*-linux-x64.tar.gz
            ./audiobook-reader/audiobook_reader
            ```

            **macOS**

            Open the `.dmg` and drag the app to Applications. The build is not
            signed or notarized, so the first launch needs Control-click → Open
            rather than a double-click; macOS will refuse it otherwise.

            **Windows**

            Unzip anywhere and run `audiobook_reader.exe`. The build is not
            signed, so SmartScreen will warn on first run — choose "More info"
            then "Run anyway".

            ## Optional extras

            The app works without these and tells you what is missing when a
            feature needs one.

            ```bash
            # Linux
            sudo apt install tesseract-ocr                        # scanned pages
            sudo apt install speech-dispatcher speech-dispatcher-espeak-ng

            # macOS
            brew install tesseract

            # Windows
            winget install UB-Mannheim.TesseractOCR
            ```

            Local AI is optional and off by default — install Ollama from
            https://ollama.com to enable it.

            For a neural voice rather than the robotic system one, install Piper
            and a voice — the app shows the exact commands for your platform in
            Settings.
