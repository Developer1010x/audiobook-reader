# Runs on every push and pull request, so a broken main is caught before anyone
# downloads a release built from it.
#
# The build matrix covers all three desktop targets. This is not redundancy for
# its own sake: most of what breaks a port is invisible to the analyzer — a path
# separator, a missing plugin registration, a subprocess that only exists on one
# OS. Only a real per-OS build catches those.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not floating. `channel: stable` silently moved CI from
          # Flutter 3.41 to 3.47 with no commit of ours, and 3.47's Dart refuses
          # to compile pdfrx_engine 0.4.5 (a transitive pin of pdfrx 2.4.7):
          #   pdf_file_cache.dart:380 — 'blockSize' on a potentially null
          #   'PdfFileCache?'.
          # The fix in pdfrx_engine 0.4.6 needs meta ^1.18.0, which this
          # Flutter's flutter_test does not allow, so the toolchain and the
          # dependency can only be moved together. Pin until pdfrx releases a
          # version that resolves to 0.4.6.
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

  # Tests run on every OS, not just Linux. The suite touches paths, file IO and
  # binary discovery, which are exactly the things that differ per platform — a
  # Linux-only test run would pass right up until a Windows user opened a book.
  test-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            build: flutter build linux --release
          - os: macos-14
            name: macos
            build: flutter build macos --release
          - os: windows-2022
            name: windows
            build: flutter build windows --release
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Kept in lockstep with the `analyze` job above — see the note there
          # for why this is pinned rather than tracking stable.
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # Linux is the only target needing system libraries; the macOS and Windows
      # runners ship their toolchains already.
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev lld \
            desktop-file-utils

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      # --concurrency=1 is deliberate: the parallel runner deadlocks on this
      # suite, which looks like a hang rather than a failure.
      - name: Test
        working-directory: app
        run: flutter test --concurrency=1

      - name: Build
        working-directory: app
        run: |
          flutter config --enable-${{ matrix.name }}-desktop
          ${{ matrix.build }}

      # Packaging metadata is easy to break silently and only fails at store
      # submission, which is far too late to find out.
      - name: Validate packaging metadata
        if: runner.os == 'Linux'
        working-directory: app/packaging/linux
        run: desktop-file-validate *.desktop
