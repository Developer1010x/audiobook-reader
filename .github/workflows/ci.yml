# Runs on every push and pull request, so a broken main is caught before anyone
# downloads a release built from it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not floating. `channel: stable` silently moved CI from
          # Flutter 3.41 to 3.47 with no commit of ours, and 3.47's Dart refuses
          # to compile pdfrx_engine 0.4.5 (a transitive pin of pdfrx 2.4.7):
          #   pdf_file_cache.dart:380 — 'blockSize' on a potentially null
          #   'PdfFileCache?'.
          # The fix in pdfrx_engine 0.4.6 needs meta ^1.18.0, which this
          # Flutter's flutter_test does not allow, so the toolchain and the
          # dependency can only be moved together. Pin until pdfrx releases a
          # version that resolves to 0.4.6.
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev lld \
            desktop-file-utils

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      # --concurrency=1 is deliberate: the parallel runner deadlocks on this
      # suite, which looks like a hang rather than a failure.
      - name: Test
        working-directory: app
        run: flutter test --concurrency=1

      - name: Build
        working-directory: app
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      # Packaging metadata is easy to break silently and only fails at store
      # submission, which is far too late to find out.
      - name: Validate packaging metadata
        working-directory: app/packaging/linux
        run: desktop-file-validate *.desktop
